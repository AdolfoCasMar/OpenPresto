name: Experimental Catalina Intel package (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Catalina build profile
        run: python -m pip install -r requirements-catalina.txt
      - name: Run source tests with Qt 6.4
        run: python tools/run_isolated_tests.py test_macos_bundle_audit.py test_auxiliary_panels.py test_technical_documents_panel.py test_rich_documents.py test_rich_text_colours.py test_rtf_pictures.py test_wmf_vector.py test_mdi_windows.py test_budget_views.py test_workspace_refresh.py
      - name: Build, check binary minimum versions and exercise packaged interface
        run: python tools/build_desktop.py --macos-profile catalina
      - name: Upload experimental package and checksum to alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.4.0a83 dist/*macos-catalina*.zip dist/*macos-catalina*.zip.sha256 --clobber
